services:
  - type: web
    name: cse341-contacts-api
    runtime: node
    plan: free
    rootDir: contacts-api
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: cse341_contacts
      - key: CONTACTS_COLLECTION
        value: contacts
      - key: USE_MEMORY_STORE
        value: "false"

  - type: web
    name: cse341-project2-crud-api
    runtime: node
    plan: free
    rootDir: project2-crud-api
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: cse341_library
      - key: BOOKS_COLLECTION
        value: books
      - key: AUTHORS_COLLECTION
        value: authors
      - key: USERS_COLLECTION
        value: users
      - key: SESSIONS_COLLECTION
        value: sessions
      - key: USE_MEMORY_STORE
        value: "false"
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OAUTH_CALLBACK_URL
        value: https://cse341-project2-crud-api-zoq8.onrender.com/auth/github/callback
      - key: OAUTH_STATE_SECRET
        sync: false

  - type: web
    name: cse341-final-project-api
    runtime: node
    plan: free
    rootDir: final-project-api
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: cse341_final_project
      - key: EVENTS_COLLECTION
        value: events
      - key: VOLUNTEERS_COLLECTION
        value: volunteers
      - key: REGISTRATIONS_COLLECTION
        value: registrations
      - key: ANNOUNCEMENTS_COLLECTION
        value: announcements
      - key: USERS_COLLECTION
        value: users
      - key: SESSIONS_COLLECTION
        value: sessions
      - key: USE_MEMORY_STORE
        value: "false"
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OAUTH_CALLBACK_URL
        value: https://cse341-final-project-api.onrender.com/auth/github/callback
      - key: OAUTH_STATE_SECRET
        sync: false
